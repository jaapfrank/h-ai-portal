<svg width="200" height="60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hoeflon-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#475569;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="60" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- HOEFLON Text -->
  <text x="100" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" 
        text-anchor="middle" fill="url(#hoeflon-gradient)">
    HOEFLON
  </text>
  
  <!-- Crane icon/symbol -->
  <g transform="translate(15, 15)">
    <rect x="0" y="15" width="4" height="20" fill="#475569"/>
    <rect x="0" y="10" width="15" height="4" fill="#f97316"/>
    <rect x="12" y="14" width="3" height="8" fill="#475569"/>
    <circle cx="16" cy="18" r="2" fill="#f97316"/>
  </g>
</svg>